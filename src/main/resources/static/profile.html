<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>My Profile - Connectify</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .profile-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 20px;
    }
    .profile-pic-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 16px;
    }
    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #6366f1;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
      background: rgba(15, 23, 42, 0.6);
    }
    .profile-upload-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #6366f1;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 2px solid #0f172a;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: transform 0.2s, background 0.2s;
    }
    .profile-upload-badge:hover {
      transform: scale(1.08);
      background: #4f46e5;
    }
    .form-group {
      width: 100%;
      margin-bottom: 16px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 13.5px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
      line-height: 1.5;
    }
    .status-badge {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container" style="max-width: 460px;">
    <!-- Top Bar Navigation -->
    <div style="display: flex; justify-content: flex-start; margin-bottom: 12px;">
      <a href="users.html" class="back-link-btn" style="margin-top: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Friends
      </a>
    </div>

    <div class="brand-header" style="margin-bottom: 18px;">
      <h2>My Profile</h2>
      <p style="color: #94a3b8; font-size: 14px; margin-top: 4px;">Update your personal details & avatar</p>
    </div>

    <!-- Profile Picture Section -->
    <div class="profile-card">
      <div class="profile-pic-container">
        <img id="profileImageDisplay" class="profile-pic" src="https://via.placeholder.com/150" alt="Profile Picture">
        <label for="profileImageInput" class="profile-upload-badge" title="Upload new photo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </label>
      </div>
      <input type="file" id="profileImageInput" accept="image/*" style="display: none;" onchange="previewSelectedImage(this)">
    </div>

    <!-- Bio Form Section -->
    <div class="form-group">
      <label for="bioInput">About Me (Bio):</label>
      <textarea id="bioInput" placeholder="Tell your friends something about yourself..."></textarea>
    </div>

    <button onclick="saveProfile()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save Changes
    </button>

    <div id="statusMessage" class="status-badge">
      ✓ Profile updated successfully!
    </div>
  </div>

  <script>
    // Immediate preview on image selection
    function previewSelectedImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('profileImageDisplay').src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }
  </script>
  <script src="profile.js"></script>
</body>
</html>
