<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Login - Connectify</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="container">
  <div class="brand-header">
    <!-- SVG Brand Logo -->
    <svg class="brand-logo-svg" viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      <circle cx="12" cy="10" r="2" fill="currentColor"></circle>
    </svg>
    <h2>Connectify</h2>
    <p style="color: #94a3b8; font-size: 14px; margin-top: 4px;">Sign in to your account</p>
  </div>

  <input type="email" id="loginEmail" placeholder="Email Address" autocomplete="email">
  <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">

  <button onclick="loginUser()">
    <span>Login</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
  </button>

  <div class="google-signin-wrapper">
    <div id="g_id_onload"
         data-client_id="1098423434890-r7daqjuoi7hgdcguk2r87gad6qnpcdd2.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponse"
         data-auto_select="false">
    </div>
    <div class="g_id_signin"
         data-type="standard"
         data-shape="rectangular"
         data-theme="filled_black"
         data-text="signin_with"
         data-size="large"
         data-logo_alignment="left"
         data-width="280">
    </div>
  </div>

  <p class="register-prompt">Don't have an account? <a href="register.html">Register</a></p>
  
  <div style="text-align: center; margin-top: 14px;">
    <a href="forgot.html" style="color: #818cf8; text-decoration: none; font-size: 14px; font-weight: 500; padding: 6px 12px; display: inline-block;">Forgot Password?</a>
  </div>
</div>

<script src="jquery.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>

</body>
</html>
